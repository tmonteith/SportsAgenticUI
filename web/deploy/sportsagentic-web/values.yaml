replicaCount: 1

image:
  # Required, e.g. ord.ocir.io/<namespace>/sportsagentic/web
  repository: ""
  pullPolicy: IfNotPresent
  # Required: the git short SHA built by CI. Keep it quoted, and use --set-string
  # for an all-digit SHA
  tag: ""

imagePullSecrets:
  - name: ocir-pull
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: sportsagentic.dev
  tlsSecretName: sportsagentic-tls
  # The orchestrator serves routes at the root, so its ingress strips /api.
  api:
    serviceName: sportsagentic-agent
    servicePort: 8000
    proxyReadTimeoutSeconds: 300

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
