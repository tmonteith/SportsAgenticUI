worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    # The root filesystem is read-only in the cluster, so temp paths live on /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    map $uri $cache_control {
        ~^/assets/ "public, max-age=31536000, immutable";
        default "no-cache";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        # Declared once here because add_header in a location would drop all of these.
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # A missing hashed asset is a 404, not index.html served as JavaScript.
        location /assets/ {
            try_files $uri =404;
        }

        # Bots probe every new site for WordPress, PHP and leaked dotfiles. Without this
        # the SPA fallback answers them with index.html and a 200, which fills the log
        # and tells scanners something is there. Nothing here serves these paths.
        location ~* (\.php$|^/wp[-/]|^/wordpress|^/xmlrpc|^/\.env|^/\.git) {
            access_log off;
            return 404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
